<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sagar Mitra — Live Ocean Intelligence</title>

<!-- ============================================================
     DEPENDENCIES: Tailwind CDN, Leaflet, Lucide. No other libraries —
     audio is pure Web Audio API, charts/animations are hand-built.
     ============================================================ -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          abyss: '#0f172a',    // slate-900 base
          panel: '#1e293b',    // slate-800, solid fallback under glass
          current: '#2dd4bf',  // turquoise accent
          pfz:     '#22c55e',  // glowing green — Potential Fishing Zones
          pin:     '#facc15',  // pulsing yellow — Argo float markers
          coral:   '#f87171',  // alerts
          mist:    '#94a3b8',  // secondary text on dark
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          sans: ['Inter', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'monospace'],
        },
      },
    },
  };
</script>

<style>
  html, body { height: 100%; }
  body { font-family: 'Inter', sans-serif; background: #0f172a; color: #e2e8f0; }

  /* ---------------- Glassmorphism panel ---------------- */
  .glass {
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.12);
  }

  /* ---------------- Pulsing yellow Argo float marker ---------------- */
  .argo-pin {
    width: 12px; height: 12px; border-radius: 999px;
    background: #facc15;
    box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.6);
    animation: pulse-yellow 2.2s ease-out infinite;
  }
  @keyframes pulse-yellow {
    0%   { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0.55); }
    70%  { box-shadow: 0 0 0 14px rgba(250, 204, 21, 0); }
    100% { box-shadow: 0 0 0 0 rgba(250, 204, 21, 0); }
  }

  /* ---------------- Glowing green PFZ marker ---------------- */
  .pfz-pin {
    width: 14px; height: 14px; border-radius: 999px;
    background: #22c55e;
    box-shadow: 0 0 8px 3px rgba(34, 197, 94, 0.85);
    animation: glow-green 2.6s ease-in-out infinite;
  }
  @keyframes glow-green {
    0%, 100% { box-shadow: 0 0 6px 2px rgba(34, 197, 94, 0.6); }
    50%      { box-shadow: 0 0 14px 6px rgba(34, 197, 94, 0.95); }
  }

  /* ---------------- Leaflet popup restyle to match dark glass theme ---------------- */
  .leaflet-popup-content-wrapper { background: rgba(15, 23, 42, 0.96); color: #e2e8f0; border-radius: 12px; border: 1px solid rgba(45, 212, 191, 0.25); }
  .leaflet-popup-tip { background: rgba(15, 23, 42, 0.96); }
  .leaflet-popup-content { margin: 12px 14px; font-family: 'Inter', sans-serif; }
  .leaflet-container a.leaflet-popup-close-button { color: #94a3b8; }

  /* ---------------- Persona badge selector ---------------- */
  .persona-badge { transition: all 0.25s ease; }
  .persona-badge.active { background: rgba(45, 212, 191, 0.18); border-color: rgba(45, 212, 191, 0.6); color: #2dd4bf; }
  .persona-badge:not(.active) { color: #94a3b8; border-color: rgba(255,255,255,0.1); }
  [data-persona-panel] { display: none; }
  [data-persona-panel].active { display: block; }

  /* ---------------- Ambient sound wave indicator ---------------- */
  .wave-bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
  .wave-bars span { width: 2.5px; background: #2dd4bf; border-radius: 2px; height: 3px; transition: height 0.1s ease; }

  /* ---------------- Basemap toggle ---------------- */
  .basemap-btn.active { background: rgba(45, 212, 191, 0.9); color: #0f172a; }

  /* ---------------- Chat ---------------- */
  #chat-thread::-webkit-scrollbar { width: 6px; }
  #chat-thread::-webkit-scrollbar-thumb { background: rgba(148,163,184,0.3); border-radius: 999px; }
  @keyframes rise-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .msg-in { animation: rise-in 0.25s ease-out; }

  /* ---------------- Mic listening pulse ---------------- */
  @keyframes mic-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(45,212,191,0.5);} 50% { box-shadow: 0 0 0 9px rgba(45,212,191,0);} }
  .mic-listening { animation: mic-pulse 1.1s ease-out infinite; }

  /* ---------------- Volume slider ---------------- */
  input[type="range"] { accent-color: #2dd4bf; }
</style>
</head>

<body class="overflow-hidden">

  <!-- ============================================================
       HEADER — title, persona badges, language selector, ambient sound
       ============================================================ -->
  <header class="glass relative z-[500] flex flex-wrap items-center justify-between gap-3 px-5 py-3">

    <!-- Brand -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg bg-current/15 flex items-center justify-center">
        <i data-lucide="waves" class="w-5 h-5 text-current"></i>
      </div>
      <div>
        <h1 class="font-display font-semibold text-lg leading-tight text-white">Sagar Mitra</h1>
        <p class="text-[11px] text-mist font-mono leading-tight">Live ARGO Ocean Intelligence · INCOIS</p>
      </div>
    </div>

    <!-- Persona badge selector -->
    <div id="persona-badges" class="flex items-center gap-2">
      <button data-persona-btn="fisherman" class="persona-badge glass rounded-full px-3 py-1.5 text-xs font-medium flex items-center gap-1.5 border">
        <i data-lucide="anchor" class="w-3.5 h-3.5"></i> Fisherman
      </button>
      <button data-persona-btn="student" class="persona-badge glass rounded-full px-3 py-1.5 text-xs font-medium flex items-center gap-1.5 border">
        <i data-lucide="graduation-cap" class="w-3.5 h-3.5"></i> Student
      </button>
      <button data-persona-btn="researcher" class="persona-badge glass rounded-full px-3 py-1.5 text-xs font-medium flex items-center gap-1.5 border">
        <i data-lucide="flask-conical" class="w-3.5 h-3.5"></i> Researcher
      </button>
    </div>

    <!-- Language selector + Ambient sound controller -->
    <div class="flex items-center gap-3">
      <select id="lang-select" class="glass text-white text-xs font-mono rounded-full px-3 py-2 border focus:outline-none focus:ring-1 focus:ring-current">
        <option value="en">English</option>
        <option value="hi">हिन्दी</option>
        <option value="ta">தமிழ்</option>
      </select>

      <div class="glass rounded-full pl-1.5 pr-3 py-1.5 flex items-center gap-2 border">
        <button id="audio-toggle" class="w-8 h-8 rounded-full bg-current/20 hover:bg-current/30 transition flex items-center justify-center flex-shrink-0">
          <i data-lucide="play" id="audio-icon" class="w-4 h-4 text-current"></i>
        </button>
        <div id="wave-indicator" class="wave-bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5" class="w-16 h-1 accent-current" />
      </div>
    </div>
  </header>

  <!-- ============================================================
       MAIN 70/30 GRID — map left, adaptive chatbot right
       ============================================================ -->
  <main class="grid grid-cols-1 lg:grid-cols-[7fr_3fr] h-[calc(100vh-64px)]">

    <!-- ---------------- LEFT (70%): LIVE MAP ---------------- -->
    <section class="relative h-[50vh] lg:h-full">
      <div id="map" class="w-full h-full z-0"></div>

      <!-- Basemap toggle -->
      <div class="absolute top-3 left-3 z-[400] glass rounded-full p-1 flex border">
        <button data-basemap="satellite" class="basemap-btn active rounded-full px-3 py-1.5 text-xs font-medium transition">Satellite</button>
        <button data-basemap="dark" class="basemap-btn rounded-full px-3 py-1.5 text-xs font-medium transition text-mist">Dark</button>
      </div>

      <!-- Legend -->
      <div class="absolute bottom-3 left-3 z-[400] glass rounded-xl px-3 py-2 text-xs font-mono space-y-1.5 border">
        <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-pin inline-block"></span> Argo float</div>
        <div class="flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-pfz inline-block"></span> Potential Fishing Zone</div>
      </div>

      <!-- Fisherman-only safety strip -->
      <div id="safety-strip" data-persona-panel data-persona="fisherman"
           class="absolute top-3 right-3 z-[400] glass border border-coral/40 rounded-xl px-3 py-2 text-xs text-coral flex items-center gap-2 max-w-[260px]">
        <i data-lucide="alert-triangle" class="w-4 h-4 flex-shrink-0"></i>
        Moderate swell past 14 nm — check conditions before heading out.
      </div>
    </section>

    <!-- ---------------- RIGHT (30%): ADAPTIVE CHATBOT ---------------- -->
    <section class="glass flex flex-col h-[50vh] lg:h-full border-l">

      <!-- Role-based quick action chips -->
      <div class="px-4 pt-4 pb-3 border-b border-white/10">
        <p id="chat-role-label" class="text-[11px] font-mono uppercase tracking-wide text-mist mb-2">Mode: Fisherman</p>
        <div class="flex flex-wrap gap-2">
          <button data-quick-action="fishing-zones" class="glass border rounded-full px-3 py-1.5 text-xs font-medium hover:bg-current/10 transition flex items-center gap-1.5">
            <i data-lucide="map-pin" class="w-3.5 h-3.5 text-pfz"></i> Find Fishing Zones
          </button>
          <button data-quick-action="telemetry-stats" class="glass border rounded-full px-3 py-1.5 text-xs font-medium hover:bg-current/10 transition flex items-center gap-1.5">
            <i data-lucide="activity" class="w-3.5 h-3.5 text-current"></i> Argo Telemetry Stats
          </button>
          <button data-quick-action="ocean-currents" class="glass border rounded-full px-3 py-1.5 text-xs font-medium hover:bg-current/10 transition flex items-center gap-1.5">
            <i data-lucide="wind" class="w-3.5 h-3.5 text-pin"></i> Explain Ocean Currents
          </button>
        </div>
      </div>

      <!-- Chat thread -->
      <div id="chat-thread" class="flex-1 overflow-y-auto px-4 py-4 space-y-3"></div>

      <!-- Composer -->
      <form id="chat-form" class="border-t border-white/10 p-3 flex items-center gap-2">
        <button type="button" id="mic-btn" class="w-9 h-9 rounded-full glass border flex items-center justify-center flex-shrink-0 hover:bg-current/10 transition" title="Voice input">
          <i data-lucide="mic" class="w-4 h-4 text-mist"></i>
        </button>
        <input id="chat-input" type="text" autocomplete="off"
               placeholder="Ask Sagar Mitra…"
               class="flex-1 glass border rounded-full px-4 py-2.5 text-sm text-white placeholder:text-mist focus:outline-none focus:ring-1 focus:ring-current" />
        <button type="submit" class="w-10 h-10 rounded-full bg-current text-abyss flex items-center justify-center flex-shrink-0 hover:brightness-110 transition">
          <i data-lucide="send" class="w-4 h-4"></i>
        </button>
      </form>
    </section>
  </main>

<script>
/* ================================================================
   SAGAR MITRA — live ocean intelligence dashboard
   Sections:
   1. Persona badge state
   2. Leaflet map: satellite/dark basemaps, pulsing float + PFZ markers
   3. Float data model + popup cards + "Sync with Assistant"
   4. Chat engine (persona + intent aware canned responses)
   5. Voice input (Web Speech API)
   6. Ambient ocean soundscape (Web Audio API, procedural, autoplay-safe)
   ================================================================ */

// ---------- 1. PERSONA STATE ----------------------------------

let activePersona = 'fisherman';
const PERSONA_LABEL = { fisherman: 'Fisherman', student: 'Student', researcher: 'Researcher' };

function setPersona(persona) {
  activePersona = persona;

  document.querySelectorAll('[data-persona-btn]').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.personaBtn === persona);
  });
  document.querySelectorAll('[data-persona-panel]').forEach(el => {
    el.classList.toggle('active', el.dataset.persona === persona);
  });
  document.getElementById('chat-role-label').textContent = `Mode: ${PERSONA_LABEL[persona]}`;

  const greetings = {
    fisherman: "Namaste! Ask me to find fishing zones, check sea safety, or tap any yellow float on the map for live readings.",
    student: "Hi! I can explain ocean currents, salinity, and what those floats on the map are measuring.",
    researcher: "Researcher mode ready. Click a float for its telemetry card, or ask for a T-test / Z-test summary.",
  };
  addMessage('bot', greetings[persona]);
}

document.querySelectorAll('[data-persona-btn]').forEach(btn => {
  btn.addEventListener('click', () => setPersona(btn.dataset.personaBtn));
});

// ---------- 2. LEAFLET MAP: BASEMAPS + MARKERS ----------------------------------

const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([12.5, 70.5], 5);

// Satellite basemap (Esri World Imagery) — default, matches the ocean/coastline aesthetic
const satelliteLayer = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: 'Tiles &copy; Esri', maxZoom: 12 }
).addTo(map);

// Dark basemap (CartoDB) — alternate low-glare option
const darkLayer = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  { attribution: '&copy; OpenStreetMap &copy; CARTO', maxZoom: 12, subdomains: 'abcd' }
);

document.querySelectorAll('[data-basemap]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-basemap]').forEach(b => { b.classList.remove('active'); b.classList.add('text-mist'); });
    btn.classList.add('active'); btn.classList.remove('text-mist');
    if (btn.dataset.basemap === 'satellite') { map.removeLayer(darkLayer); satelliteLayer.addTo(map); }
    else { map.removeLayer(satelliteLayer); darkLayer.addTo(map); }
  });
});

// ---------- 3. FLOAT DATA MODEL + POPUPS + SYNC-WITH-ASSISTANT ----------------------------------

// Mock live ARGO float telemetry, scoped to the Arabian Sea / Bay of Bengal.
// Swap this array for a real INCOIS feed — the rendering and popup logic don't change.
const floatData = [
  { id: '2902123', lat: 14.2, lon: 68.9, depth: 1998, sst: 27.8, sal: 35.4 },
  { id: '2902198', lat: 17.6, lon: 66.1, depth: 2004, sst: 26.9, sal: 35.9 },
  { id: '2901784', lat: 11.8, lon: 71.4, depth: 1985, sst: 28.3, sal: 34.8 },
  { id: '2902341', lat: 9.4,  lon: 76.8, depth: 1990, sst: 28.9, sal: 34.5 },
  { id: '2902055', lat: 16.9, lon: 84.2, depth: 2010, sst: 29.1, sal: 33.9 },
  { id: '2901967', lat: 6.8,  lon: 80.6, depth: 1975, sst: 28.6, sal: 34.7 },
];

// Potential Fishing Zones — mock, driven by SST/chlorophyll proxy in floatData
const pfzZones = [
  { lat: 14.6, lon: 70.2, label: 'Off Ratnagiri' },
  { lat: 9.8,  lon: 75.9, label: 'Off Kochi' },
  { lat: 17.2, lon: 83.6, label: 'Off Visakhapatnam' },
];

const argoIcon = L.divIcon({ className: '', html: '<div class="argo-pin"></div>', iconSize: [12, 12] });
const pfzIcon  = L.divIcon({ className: '', html: '<div class="pfz-pin"></div>', iconSize: [14, 14] });

// Quick, real confidence check per float: compares this float's SST against the
// fleet mean using a one-sample z-test, so the popup shows a genuine statistic.
function floatConfidence(f) {
  const fleetSst = floatData.map(x => x.sst);
  const m = fleetSst.reduce((a, b) => a + b, 0) / fleetSst.length;
  const sd = Math.sqrt(fleetSst.reduce((a, b) => a + (b - m) ** 2, 0) / (fleetSst.length - 1));
  const z = (f.sst - m) / (sd / Math.sqrt(fleetSst.length));
  return { z, significant: Math.abs(z) > 1.96 };
}

function popupHtml(f) {
  const conf = floatConfidence(f);
  return `
    <div class="w-56 font-sans">
      <p class="font-display font-semibold text-current text-sm mb-1">Float ${f.id}</p>
      <div class="font-mono text-[11px] text-slate-200 space-y-0.5 mb-2">
        <div>Depth: ${f.depth} m</div>
        <div>Sea Surface Temp: ${f.sst.toFixed(1)} °C</div>
        <div>Salinity: ${f.sal.toFixed(1)} PSU</div>
        <div class="text-mist">Z = ${conf.z.toFixed(2)} · ${conf.significant ? 'significant vs fleet mean' : 'within normal range'}</div>
      </div>
      <button onclick="syncFloatToAssistant('${f.id}')"
              class="w-full bg-current text-abyss text-xs font-semibold rounded-full py-1.5 flex items-center justify-center gap-1.5">
        Sync with Assistant
      </button>
    </div>
  `;
}

floatData.forEach(f => {
  L.marker([f.lat, f.lon], { icon: argoIcon }).addTo(map).bindPopup(popupHtml(f));
});

pfzZones.forEach(z => {
  L.marker([z.lat, z.lon], { icon: pfzIcon }).addTo(map).bindPopup(`<div class="text-xs font-medium text-pfz">${z.label}</div><div class="text-[11px] text-mist font-mono">Potential Fishing Zone</div>`);
});

// Popup button calls this — sends a float-specific query straight to the chatbot
window.syncFloatToAssistant = function (floatId) {
  map.closePopup();
  handleUserMessage(`Tell me about float ${floatId}`);
};

// ---------- 4. CHAT ENGINE ----------------------------------

const thread = document.getElementById('chat-thread');

function addMessage(sender, text) {
  const wrap = document.createElement('div');
  wrap.className = `msg-in flex ${sender === 'user' ? 'justify-end' : 'justify-start'}`;
  const bubble = document.createElement('div');
  bubble.className = sender === 'user'
    ? 'max-w-[85%] bg-current text-abyss text-sm font-medium rounded-2xl rounded-br-sm px-4 py-2.5'
    : 'max-w-[85%] glass border text-slate-100 text-sm rounded-2xl rounded-bl-sm px-4 py-2.5';
  bubble.textContent = text;
  wrap.appendChild(bubble);
  thread.appendChild(wrap);
  thread.scrollTop = thread.scrollHeight;
}

function generateResponse(persona, message) {
  const m = message.toLowerCase();

  // Float-specific lookup (used by "Sync with Assistant")
  const floatMatch = m.match(/float (\d+)/);
  if (floatMatch) {
    const f = floatData.find(x => x.id === floatMatch[1]);
    if (f) {
      const conf = floatConfidence(f);
      map.flyTo([f.lat, f.lon], 7, { duration: 1 });
      return `Float ${f.id}: SST ${f.sst.toFixed(1)}°C, salinity ${f.sal.toFixed(1)} PSU at ${f.depth} m depth. Z = ${conf.z.toFixed(2)} vs fleet mean (${conf.significant ? 'significant' : 'normal range'}).`;
    }
  }

  if (m.includes('fishing zone') || m.includes('where to fish')) {
    map.flyTo([14.6, 70.2], 6, { duration: 1 });
    return 'Highlighted zones off Ratnagiri, Kochi, and Visakhapatnam — the green markers show today\'s Potential Fishing Zones based on SST and chlorophyll signals.';
  }
  if (m.includes('telemetry') || m.includes('stats') || m.includes('t-test') || m.includes('z-test')) {
    return `Fleet snapshot: ${floatData.length} active floats, mean SST ${(floatData.reduce((a,b)=>a+b.sst,0)/floatData.length).toFixed(2)}°C. Click any yellow float for its individual Z-test confidence.`;
  }
  if (m.includes('current')) {
    return 'Ocean currents are driven by wind, temperature, and salinity differences. In this region, the West India Coastal Current reverses seasonally with the monsoon.';
  }

  if (persona === 'fisherman') {
    if (m.includes('safe')) return 'Conditions are moderate today: wave height ~1.4m, wind 14 knots. Safe within 14 nautical miles.';
    return 'Try "Find Fishing Zones", tap a float on the map, or ask if it\'s safe to go out today.';
  }
  if (persona === 'student') {
    if (m.includes('salin')) return 'Salinity is the dissolved salt content of seawater, measured in PSU — it rises with evaporation and falls near river mouths.';
    if (m.includes('thermocline')) return 'The thermocline is the depth band where temperature drops sharply, separating warm surface water from the cold deep ocean.';
    return 'Ask me to explain currents, salinity, or what a float\'s readings mean.';
  }
  return 'Ask about fleet telemetry, a specific float, or request a T-test / Z-test summary.';
}

function handleUserMessage(text) {
  if (!text.trim()) return;
  addMessage('user', text);
  document.getElementById('chat-input').value = '';
  setTimeout(() => addMessage('bot', generateResponse(activePersona, text)), 350);
}

document.getElementById('chat-form').addEventListener('submit', e => {
  e.preventDefault();
  handleUserMessage(document.getElementById('chat-input').value);
});

document.querySelectorAll('[data-quick-action]').forEach(btn => {
  const prompts = {
    'fishing-zones': 'Find fishing zones',
    'telemetry-stats': 'Show Argo telemetry stats',
    'ocean-currents': 'Explain ocean currents',
  };
  btn.addEventListener('click', () => handleUserMessage(prompts[btn.dataset.quickAction]));
});

// ---------- 5. VOICE INPUT ----------------------------------

const micBtn = document.getElementById('mic-btn');
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const langForSpeech = { en: 'en-IN', hi: 'hi-IN', ta: 'ta-IN' };

if (SpeechRecognition) {
  const recognizer = new SpeechRecognition();
  recognizer.continuous = false;
  recognizer.interimResults = false;
  micBtn.addEventListener('click', () => {
    recognizer.lang = langForSpeech[document.getElementById('lang-select').value] || 'en-IN';
    micBtn.classList.add('mic-listening');
    recognizer.start();
  });
  recognizer.addEventListener('result', e => handleUserMessage(e.results[0][0].transcript));
  recognizer.addEventListener('end', () => micBtn.classList.remove('mic-listening'));
  recognizer.addEventListener('error', () => micBtn.classList.remove('mic-listening'));
} else {
  micBtn.addEventListener('click', () => addMessage('bot', 'Voice input isn\'t supported in this browser — try typing instead.'));
}

// ---------- 6. AMBIENT OCEAN SOUNDSCAPE (procedural, Web Audio API) ----------------------------------
// Built as filtered brown noise with a slow gain LFO to emulate swell, rather than
// streaming an external audio file — avoids CORS/licensing issues and autoplay
// blocks entirely, since the AudioContext is only created on a real user click.

let audioCtx = null;
let masterGain = null;
let analyser = null;
let isPlaying = false;

function initAudio() {
  if (audioCtx) return; // already built

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Generate a buffer of brown noise (integrated white noise -> deeper, ocean-like rumble)
  const bufferSize = audioCtx.sampleRate * 4;
  const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = noiseBuffer.getChannelData(0);
  let lastOut = 0;
  for (let i = 0; i < bufferSize; i++) {
    const white = Math.random() * 2 - 1;
    lastOut = (lastOut + 0.02 * white) / 1.02;
    data[i] = lastOut * 3.5; // gain-compensate brown noise's natural quietness
  }

  const noiseSource = audioCtx.createBufferSource();
  noiseSource.buffer = noiseBuffer;
  noiseSource.loop = true;

  // Lowpass filter softens it into a wash rather than a hiss
  const lowpass = audioCtx.createBiquadFilter();
  lowpass.type = 'lowpass';
  lowpass.frequency.value = 700;

  // Slow LFO modulates gain to emulate wave swell (rises and falls every ~4s)
  const swellGain = audioCtx.createGain();
  const lfo = audioCtx.createOscillator();
  const lfoDepth = audioCtx.createGain();
  lfo.frequency.value = 0.15;
  lfoDepth.gain.value = 0.15;
  swellGain.gain.value = 0.35;
  lfo.connect(lfoDepth);
  lfoDepth.connect(swellGain.gain);
  lfo.start();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = parseFloat(document.getElementById('volume-slider').value);

  analyser = audioCtx.createAnalyser();
  analyser.fftSize = 32;

  noiseSource.connect(lowpass);
  lowpass.connect(swellGain);
  swellGain.connect(masterGain);
  masterGain.connect(analyser);
  analyser.connect(audioCtx.destination);

  noiseSource.start();
  drawWaveIndicator();
}

function drawWaveIndicator() {
  const bars = document.querySelectorAll('#wave-indicator span');
  if (!analyser) { bars.forEach(b => b.style.height = '3px'); return; }
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  bars.forEach((bar, i) => {
    const v = isPlaying ? data[i * 2] || 0 : 0;
    bar.style.height = `${3 + (v / 255) * 12}px`;
  });
  requestAnimationFrame(drawWaveIndicator);
}

document.getElementById('audio-toggle').addEventListener('click', async () => {
  initAudio(); // no-op after first click; this click is the "user gesture" autoplay requires
  if (audioCtx.state === 'suspended') await audioCtx.resume();

  isPlaying = !isPlaying;
  if (isPlaying) { await audioCtx.resume(); } else { await audioCtx.suspend(); }

  document.getElementById('audio-icon').setAttribute('data-lucide', isPlaying ? 'pause' : 'play');
  lucide.createIcons();
});

document.getElementById('volume-slider').addEventListener('input', e => {
  if (masterGain) masterGain.gain.value = parseFloat(e.target.value);
});

// ---------- INIT ----------------------------------

lucide.createIcons();
setPersona('fisherman');
</script>
</body>
